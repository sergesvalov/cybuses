<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyprus Bus Board</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Registration failed', err));
            });
        }
    </script>
    <script type="module" src="/static/js/app.js"></script>
</head>

<body>
    <!-- Background decorations for premium feel -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <header class="header">
            <h2>Автобусы Пафоса</h2>
            <button class="icon-btn refresh-btn" id="r-btn" aria-label="Refresh data">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                    <path d="M16 21v-5h5" />
                </svg>
            </button>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="route-search" class="search-input"
                placeholder="Поиск по направлению (например, Аэропорт, Coral Bay)..." aria-label="Search routes">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
            </svg>
        </div>

        <!-- Filter Components Mount Point -->
        <div id="filter-container"></div>

        <!-- App / Cards Mount Point -->
        <main id="app"></main>
    </div>

    <!-- Modal Component Mount Point -->
    <div id="modal" class="modal">
        <div class="modal-overlay" id="m-overlay"></div>
        <div class="m-content">
            <h3 id="m-t" class="m-title"></h3>
            <p id="m-n" class="m-text"></p>
            <button id="m-close" class="btn-primary">Понятно</button>
        </div>
    </div>
</body>

</html>
