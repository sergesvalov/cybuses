<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paphos Bus Board</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/app.js"></script>
</head>

<body>
    <div class="header">
        <h2>🇨🇾 Bus Board</h2>
        <button class="refresh-btn" id="r-btn" aria-label="Refresh data">↻</button>
    </div>

    <!-- Filter Components Mount Point -->
    <div id="filter-container">
        <!-- Injected by FilterBar.js -->
    </div>

    <!-- App / Cards Mount Point -->
    <div id="app"></div>

    <!-- Modal Component Mount Point -->
    <div id="modal" class="modal">
        <div class="m-content">
            <div id="m-t"></div>
            <div id="m-n"></div>
            <button id="m-close" class="m-btn">OK</button>
        </div>
    </div>
</body>

</html>
