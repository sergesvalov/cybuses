<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyprus Bus Board</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/app.js"></script>
</head>

<body>
    <!-- Background decorations for premium feel -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <header class="header">
            <h2>Расписание Кипра</h2>
            <button class="icon-btn refresh-btn" id="r-btn" aria-label="Refresh data">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 21v-5h5"/>
                </svg>
            </button>
        </header>

        <!-- Filter Components Mount Point -->
        <div id="filter-container"></div>

        <!-- App / Cards Mount Point -->
        <main id="app"></main>
    </div>

    <!-- Modal Component Mount Point -->
    <div id="modal" class="modal">
        <div class="modal-overlay" id="m-overlay"></div>
        <div class="m-content">
            <h3 id="m-t" class="m-title"></h3>
            <p id="m-n" class="m-text"></p>
            <button id="m-close" class="btn-primary">Понятно</button>
        </div>
    </div>
</body>

</html>
